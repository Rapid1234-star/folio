<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Particles Interaction Demo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050a05; color: #00ff41; font-family: monospace; }
    #ui { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; gap: 10px; flex-direction: column;}
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; max-width: 1000px; max-height: 200px; overflow-y: auto;}
    button { background: rgba(0,255,65,0.1); border: 1px solid #00ff41; color: #00ff41; padding: 6px 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 11px; font-family: monospace; transition: all 0.2s;}
    button:hover, button.active { background: #00ff41; color: #000; }
    #info { margin-top: 10px; font-size: 13px; max-width: 600px; line-height: 1.5; color: rgba(0,255,65,0.8); background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid rgba(0,255,65,0.3); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div class="buttons" id="btn-container">
      <!-- Buttons injected via JS to save space -->
    </div>
    <div id="info">Hover over a mode!</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#050a05');
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 400;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    let currentMode = 11; 
    let pointerActive = false;
    const mouseVec = new THREE.Vector3(0, 0, 0);
    
    const descriptions = {
      1: "1. Breathing Hub (Physics)", 2: "2. Constellation (Physics)", 3: "3. Data Vortex (Physics)", 4: "4. Magnetic Orbit (Physics)", 5: "5. Elastic Web (Physics)", 6: "6. Pulse Network (Physics)", 7: "7. Quantum Jitter (Physics)", 8: "8. Black Hole (Physics)", 9: "9. Shockwave (Physics)", 10: "10. Sticky Swarm (Physics)",
      11: "Mode 11: Neural Synapse. Particles don't move. Connections flash with random extreme brightness like firing neurons.",
      12: "Mode 12: Grid Scanner. Lines only connect if particles align strictly on the X or Y axis with your cursor.",
      13: "Mode 13: Data Cascade. Lines only draw *downwards* from your mouse, simulating data falling from the hub.",
      14: "Mode 14: Delaunay Web. Connects cursor to particles, AND connects those particles to each other, forming a rigid triangle mesh.",
      15: "Mode 15: Radar Sweep. A rotating radar slice scans the network. Lines only appear inside the sweeping angle.",
      16: "Mode 16: Binary Pulse. Connections alternate strictly between pure red and pure cyan channels.",
      17: "Mode 17: The Firewall. Lines only form exactly at the edge of the radius, creating a hollow protective ring/shield.",
      18: "Mode 18: Fiber Optics. Ultra-long connections that pulse rapidly along the network like data packets.",
      19: "Mode 19: Core Anchors. Limits connections to exactly 4 particles, creating a highly minimal, focused root network.",
      20: "Mode 20: Echolocation. Concentric rings of connection expand outward from your cursor like sonar waves.",
      21: "Mode 21: Glitch Hub. The connection radius frantically jumps and glitches, creating a corrupted network visual.",
      22: "Mode 22: Hex Lattice. Connects exactly 6 nodes to simulate a rigid molecular/hexagonal bond.",
      23: "Mode 23: Ghost Nodes. Particles become completely invisible. The network lines materialize out of the pure void.",
      24: "Mode 24: Warp Speed. Lines radiate outwards from the particles away from the cursor, simulating tunnel speed.",
      25: "Mode 25: The Architect. Lines only draw in strict 90-degree orthogonal angles, creating a rigid structural city grid."
    };

    const btnContainer = document.getElementById('btn-container');
    for (let i = 11; i <= 25; i++) {
      const btn = document.createElement('button');
      btn.id = 'btn' + i;
      btn.innerText = i + ". " + descriptions[i].split(':')[1].split('.')[0].trim();
      if (i === 11) btn.classList.add('active');
      btn.onclick = (e) => setMode(i, e.target);
      btnContainer.appendChild(btn);
    }
    document.getElementById('info').innerText = descriptions[11];

    function setMode(mode, target) {
      currentMode = mode;
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      target.classList.add('active');
      document.getElementById('info').innerText = descriptions[mode];
      
      // Handle Ghost Nodes mode visibility
      if (mode === 23) {
        material.opacity = 0.0;
      } else {
        material.opacity = 0.6;
      }
    }

    const PARTICLE_COUNT = 3000;
    const SPREAD = 800;
    const NOISE = 400;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const basePositions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const phases = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const idx = i * 3;
      const r = SPREAD * Math.cbrt(Math.random());
      const theta = Math.random() * 2 * Math.PI;
      const phi = Math.acos(2 * Math.random() - 1);
      
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = (r * Math.cos(phi)) * 0.4; 

      positions[idx] = x; positions[idx + 1] = y; positions[idx + 2] = z;
      basePositions[idx] = x; basePositions[idx + 1] = y; basePositions[idx + 2] = z;
      
      velocities[idx] = 0; velocities[idx + 1] = 0; velocities[idx + 2] = 0;
      phases[i] = Math.random() * Math.PI * 2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.2, 'rgba(0,255,65,0.8)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 32, 32);
    const sprite = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 3.5,
      map: sprite,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    const linesGeometry = new THREE.BufferGeometry();
    const linesMaterial = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 1.0, 
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const lines = new THREE.LineSegments(linesGeometry, linesMaterial);
    scene.add(lines);

    window.addEventListener('mousemove', (e) => {
      pointerActive = true;
      const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
      const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
      
      const fov = camera.fov * Math.PI / 180;
      const h = 2 * Math.tan(fov / 2) * camera.position.z;
      const w = h * (window.innerWidth / window.innerHeight);
      
      mouseVec.set(ndcX * w / 2, ndcY * h / 2, 0);
    });
    
    window.addEventListener('mouseleave', () => pointerActive = false);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      const pos = geometry.attributes.position.array;
      const FRICTION = 0.92;
      
      const linePositions = [];
      const lineColors = [];
      const closeNodeIndices = []; 

      // Sort nodes by distance for modes that need exact counts (like 19, 22)
      const distArray = [];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const bx = basePositions[idx];
        const by = basePositions[idx + 1];
        const bz = basePositions[idx + 2];
        
        let cx = pos[idx];
        let cy = pos[idx + 1];
        let cz = pos[idx + 2];
        
        let vx = velocities[idx];
        let vy = velocities[idx + 1];
        let vz = velocities[idx + 2];

        const phase = phases[i];
        const driftX = Math.sin(time * 0.5 + phase) * NOISE * 0.05;
        const driftY = Math.cos(time * 0.6 + phase) * NOISE * 0.05;
        
        const dx = cx - mouseVec.x;
        const dy = cy - mouseVec.y;
        const dz = cz - mouseVec.z;
        const distToMouse = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        distArray.push({ id: i, idx, cx, cy, cz, dx, dy, dz, dist: distToMouse, phase });

        // --- ALL PHYSICS REMOVED AS REQUESTED ---
        // Particles just gently return to base drift. No attraction/repulsion.
        const dxToBase = (bx + driftX) - cx;
        const dyToBase = (by + driftY) - cy;
        const dzToBase = bz - cz;
        
        vx += dxToBase * 0.5 * dt;
        vy += dyToBase * 0.5 * dt;
        vz += dzToBase * 0.5 * dt;

        vx *= FRICTION;
        vy *= FRICTION;
        vz *= FRICTION;

        velocities[idx] = vx;
        velocities[idx + 1] = vy;
        velocities[idx + 2] = vz;

        pos[idx] += vx;
        pos[idx + 1] += vy;
        pos[idx + 2] += vz;
      }
      geometry.attributes.position.needsUpdate = true;

      // --- NEW VISUAL NETWORK MODES (11 - 25) ---
      if (pointerActive) {
        
        // Mode 19 and 22 need sorted closest nodes
        if (currentMode === 19 || currentMode === 22) {
          distArray.sort((a, b) => a.dist - b.dist);
        }

        let connectionCount = 0;

        for (let i = 0; i < distArray.length; i++) {
          const p = distArray[i];
          let drawLine = false;
          let r = 0.2, g = 1.0, b = 0.33; // Default neon green
          let intensity = 1.0;
          let p1 = [mouseVec.x, mouseVec.y, mouseVec.z];
          let p2 = [p.cx, p.cy, p.cz];
          let multipleSegments = false;
          let segments = []; // format: [x1,y1,z1, x2,y2,z2]

          const RADIUS = 150; // generous baseline

          if (currentMode === 11) { // Neural Synapse
            if (p.dist < 55) {
              drawLine = true;
              // Flash based on high freq sin
              intensity = Math.pow(Math.sin(time * 20.0 + p.phase), 4.0);
              r = 0.5; g = 1.0; b = 0.8;
            }
          } 
          else if (currentMode === 12) { // Grid Scanner
            if (p.dist < 70) {
              if (Math.abs(p.dx) < 8 || Math.abs(p.dy) < 8) {
                drawLine = true;
                intensity = 1.0 - (p.dist / 70);
              }
            }
          }
          else if (currentMode === 13) { // Data Cascade
            if (p.dist < 60 && p.dy < 0) { // Only below mouse
              drawLine = true;
              intensity = 1.0 - (p.dist / 60);
            }
          }
          else if (currentMode === 14) { // Delaunay Web
            if (p.dist < 55) {
              drawLine = true;
              intensity = 1.0 - (p.dist / 55);
              closeNodeIndices.push(p.id); // Save for inter-connections
            }
          }
          else if (currentMode === 15) { // Radar Sweep
            if (p.dist < 70) {
              const angle = Math.atan2(p.dy, p.dx);
              const sweep = (time * 2.0) % (Math.PI * 2) - Math.PI;
              let diff = Math.abs(angle - sweep);
              if (diff > Math.PI) diff = Math.PI * 2 - diff; // Wrap around
              if (diff < 0.4) {
                drawLine = true;
                intensity = 1.0 - (diff / 0.4); // fade edges of the beam
                g = 1.0; r = 0.0; b = 0.0; // Pure green radar
              }
            }
          }
          else if (currentMode === 16) { // Binary Pulse
            if (p.dist < 55) {
              drawLine = true;
              intensity = Math.pow(1.0 - (p.dist / 55), 2);
              if (p.id % 2 === 0) {
                r = 1.0; g = 0.1; b = 0.1; // Red
              } else {
                r = 0.1; g = 0.8; b = 1.0; // Cyan
              }
            }
          }
          else if (currentMode === 17) { // The Firewall
            const diff = Math.abs(p.dist - 55);
            if (diff < 10) { // Only draw exactly at radius 55
              drawLine = true;
              intensity = 1.0 - (diff / 10);
              r = 1.0; g = 0.3; b = 0.0; // Orange/Red shield
            }
          }
          else if (currentMode === 18) { // Fiber Optics
            if (p.dist < 75) {
              drawLine = true;
              // Moving data packet simulation via color phasing
              const packet = Math.sin(p.dist * 0.1 - time * 10.0);
              intensity = (packet > 0.8) ? 2.0 : 0.1; // Bright dot traveling
              r = 0.1; g = 0.5; b = 1.0; // Blue optic
            }
          }
          else if (currentMode === 19) { // Core Anchors
            if (connectionCount < 4) {
              drawLine = true;
              intensity = 1.5;
              connectionCount++;
            }
          }
          else if (currentMode === 20) { // Echolocation
            const wave1 = Math.abs(p.dist - ((time * 30) % 80));
            const wave2 = Math.abs(p.dist - (((time * 30) + 40) % 80));
            if (wave1 < 10 || wave2 < 10) {
              drawLine = true;
              intensity = wave1 < 10 ? 1.0 - (wave1/10) : 1.0 - (wave2/10);
            }
          }
          else if (currentMode === 21) { // Glitch Hub
            const glitchRadius = 20 + Math.random() * 50;
            if (p.dist < glitchRadius) {
              drawLine = true;
              intensity = Math.random();
              if (Math.random() > 0.9) { r=1; g=0; b=0; } // occasional red corruption
            }
          }
          else if (currentMode === 22) { // Hex Lattice
            if (connectionCount < 6) {
              drawLine = true;
              intensity = 1.0;
              r = 0.8; g = 0.2; b = 1.0; // Purple bonds
              connectionCount++;
            }
          }
          else if (currentMode === 23) { // Ghost Nodes
            if (p.dist < 60) {
              drawLine = true;
              intensity = Math.pow(1.0 - (p.dist / 60), 2);
              r = 1.0; g = 1.0; b = 1.0; // Ethereal white
            }
          }
          else if (currentMode === 24) { // Warp Speed
            if (p.dist < 70 && p.dist > 20) {
              drawLine = true;
              intensity = 1.0 - (p.dist / 70);
              // Draw line from particle, pointing AWAY from mouse
              const dirVec = new THREE.Vector3(p.dx, p.dy, p.dz).normalize().multiplyScalar(20); // 20px long trail
              p1 = [p.cx, p.cy, p.cz];
              p2 = [p.cx + dirVec.x, p.cy + dirVec.y, p.cz + dirVec.z];
              r = 0.5; g = 0.8; b = 1.0;
            }
          }
          else if (currentMode === 25) { // The Architect (Orthogonal)
            if (p.dist < 60) {
              drawLine = true;
              multipleSegments = true;
              intensity = 0.8;
              r = 1.0; g = 0.8; b = 0.2; // Cyberpunk Gold
              // Path: Mouse -> Match X -> Match Y -> Particle
              segments = [
                mouseVec.x, mouseVec.y, mouseVec.z,
                p.cx, mouseVec.y, mouseVec.z,
                
                p.cx, mouseVec.y, mouseVec.z,
                p.cx, p.cy, mouseVec.z,
                
                p.cx, p.cy, mouseVec.z,
                p.cx, p.cy, p.cz
              ];
            }
          }

          if (drawLine) {
            if (multipleSegments) {
              for (let s = 0; s < segments.length; s+=6) {
                linePositions.push(segments[s], segments[s+1], segments[s+2], segments[s+3], segments[s+4], segments[s+5]);
                lineColors.push(r*intensity, g*intensity, b*intensity, r*intensity, g*intensity, b*intensity);
              }
            } else {
              linePositions.push(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2]);
              lineColors.push(r*intensity, g*intensity, b*intensity, r*intensity, g*intensity, b*intensity);
            }
          }
        }

        // Mode 14 Extra: Delaunay Web cross-connections
        if (currentMode === 14) {
          for (let i = 0; i < closeNodeIndices.length; i++) {
            for (let j = i + 1; j < closeNodeIndices.length; j++) {
              const idx1 = closeNodeIndices[i] * 3;
              const idx2 = closeNodeIndices[j] * 3;
              const dx = pos[idx1] - pos[idx2];
              const dy = pos[idx1 + 1] - pos[idx2 + 1];
              const dz = pos[idx1 + 2] - pos[idx2 + 2];
              if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 40) {
                linePositions.push(pos[idx1], pos[idx1+1], pos[idx1+2], pos[idx2], pos[idx2+1], pos[idx2+2]);
                lineColors.push(0.1, 0.4, 0.2, 0.1, 0.4, 0.2); // Dimmer cross-links
              }
            }
          }
        }
      }
      
      if (linePositions.length > 0) {
        linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        linesGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
      } else {
        if (linesGeometry.attributes.position && linesGeometry.attributes.position.count > 0) {
          linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
          linesGeometry.setAttribute('color', new THREE.Float32BufferAttribute([], 3));
        }
      }

      points.rotation.y = Math.sin(time * 0.1) * 0.1;
      points.rotation.x = Math.cos(time * 0.1) * 0.1;
      lines.rotation.copy(points.rotation);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
